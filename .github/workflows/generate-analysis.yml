name: Generate analysis outputs

on:
  workflow_dispatch:
  push:
    paths:
      - analyze.py
      - data/**
      - .github/workflows/generate-analysis.yml

concurrency:
  group: cms-analysis
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas matplotlib
      - name: Run all three analyses
        run: python analyze.py
      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ figures/
          if ! git diff --cached --quiet; then
            git commit -m "Generate CMS-source-based analysis outputs"
            git push
          fi
